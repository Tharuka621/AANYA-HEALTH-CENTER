version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: aanya_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "1212"
      MYSQL_DATABASE: health_center_db
    ports:
      - "3307:3306"
    volumes:
      - aanya_mysql_data:/var/lib/mysql
      - ./db dump.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password

volumes:
  aanya_mysql_data:
